<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form da Imagem</title>
    <link rel="stylesheet" href="estilocss/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lemon&display=swap" rel="stylesheet">

</head>
<body class="corpo-form">

    <div class="conteiner">
        <section class="header">
            <h2>Sua Nova Imagem</h2>
        </section>

        <form id="form" class="form">
            <div class="form-cont">
                <label for="title-img">Digite o Titulo da sua Imagem:</label>
                <input type="text" id="title-img" placeholder="Titulo para sua Imagem...">
                <a class="msg-error"></a>
            </div>
            <div>

            </div>

            <div class="form-cont">
                <label for="url-img">Digite a URL da sua Imagem:</label>
                <input type="url" id="url-img" placeholder="URL para sua Imagem...">
                <a class="msg-error"></a>
            </div>
            <div>

            <button type="submit">Confirmar</button>

        </form>

    </div>
    <script src="java.js" defer></script>
</body>
</html>
